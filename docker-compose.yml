name: majhi

services:
  server:
    build:
      context: .
      # Bakes a passwd entry for the owner's uid into the image (see Dockerfile).
      args:
        HOST_UID: ${HOST_UID:-1000}
        HOST_GID: ${HOST_GID:-1000}
        HOST_HOME: ${HOME}
        # `make up` and the host helper pass `git rev-parse HEAD`. It is baked into the image.
        MAJHI_COMMIT: ${MAJHI_COMMIT:-dev}
    image: majhi-server:dev
    init: true
    restart: unless-stopped
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    ports:
      - "127.0.0.1:${MAJHI_PORT:-7070}:7070"
    environment:
      HOST_HOME: ${HOME:?HOME must be set}
      MAJHI_HOME: ${HOME}/.majhi
      SSH_AUTH_SOCK: /run/ssh-agent.sock
    volumes:
      # Same absolute paths as on the host, so paths match everywhere (SPEC 4.5).
      - ${HOME}/.majhi:${HOME}/.majhi
      - ${HOME}/.ssh/config:${HOME}/.ssh/config:ro
      - ${HOME}/.ssh/known_hosts:${HOME}/.ssh/known_hosts:ro
      - ${SSH_AGENT_SOCK:-/run/host-services/ssh-auth.sock}:/run/ssh-agent.sock
      # SSH public keys (never private ones) and workspace roots are added by docker-compose.override.yml, generated by `make up` and by the host helper when roots change.
    secrets:
      - majhi_key
    # Agent CLIs (Claude Code, Codex) need far more than the 512m the bare server did.
    mem_limit: 6g

secrets:
  # The age key for ~/.majhi/secrets.age. `make up` creates it when missing.
  majhi_key:
    file: ${MAJHI_SECRETS_KEY:-${HOME}/.config/majhi/secrets.key}
