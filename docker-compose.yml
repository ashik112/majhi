name: majhi

services:
  server:
    build:
      context: .
      target: runtime
      # Bakes a passwd entry for the owner's uid into the image (see Dockerfile).
      args:
        HOST_UID: ${HOST_UID:-1000}
        HOST_GID: ${HOST_GID:-1000}
        HOST_HOME: ${HOME}
        # `make up` and the host helper pass `git rev-parse HEAD`. It is baked into the image.
        MAJHI_COMMIT: ${MAJHI_COMMIT:-dev}
    image: majhi-server:dev
    init: true
    restart: unless-stopped
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    ports:
      - "127.0.0.1:${MAJHI_PORT:-7070}:7070"
    environment:
      HOST_HOME: ${HOME:?HOME must be set}
      MAJHI_HOME: ${HOME}/.majhi
      SSH_AUTH_SOCK: /run/ssh-agent.sock
      # Agents run in their own runner container per run, never in this one (Phase 2c).
      MAJHI_RUNNER: container
      MAJHI_RUNNER_IMAGE: majhi-runner:dev
      MAJHI_RUNNER_NETWORK: majhi-runners
      MAJHI_RUNNER_USER: "${HOST_UID:-1000}:${HOST_GID:-1000}"
      MAJHI_RUNNER_MCP_HOST: majhi-server
      # Days, weeks and months of tokens and cost follow the owner's zone. `make up` reads it from the Mac.
      TZ: ${MAJHI_TZ:-UTC}
    volumes:
      # Same absolute paths as on the host, so paths match everywhere (SPEC 4.5).
      - ${HOME}/.majhi:${HOME}/.majhi
      - ${HOME}/.ssh/config:${HOME}/.ssh/config:ro
      - ${HOME}/.ssh/known_hosts:${HOME}/.ssh/known_hosts:ro
      - ${SSH_AGENT_SOCK:-/run/host-services/ssh-auth.sock}:/run/ssh-agent.sock
      # To start runner containers. Only majhi's server has it; runs never do. Its group comes from the override.
      - ${DOCKER_SOCK:-/var/run/docker.sock}:/var/run/docker.sock
      # SSH public keys (never private ones) and workspace roots are added by docker-compose.override.yml, generated by `make up` and by the host helper when roots change.
    secrets:
      - majhi_key
    # Agents run in runners now; the CLIs still start here for sign-in, health checks and usage reads.
    mem_limit: 2g
    networks:
      default: {}
      runners:
        aliases: [majhi-server]

  # The image agent runs use. Built with `--profile runner`, never started by compose: the server
  # starts one container per run.
  runner:
    build:
      context: .
      target: runner
      args:
        HOST_UID: ${HOST_UID:-1000}
        HOST_GID: ${HOST_GID:-1000}
        HOST_HOME: ${HOME}
    image: majhi-runner:dev
    profiles: [runner]

networks:
  # Runners join this network. From it, the server answers only /mcp.
  runners:
    name: majhi-runners

secrets:
  # The age key for ~/.majhi/secrets.age. `make up` creates it when missing.
  majhi_key:
    file: ${MAJHI_SECRETS_KEY:-${HOME}/.config/majhi/secrets.key}
