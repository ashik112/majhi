packages:
  - apps/*
  - packages/*
allowBuilds:
  better-sqlite3: true
  esbuild: true
  node-pty: true
  onnxruntime-node: false
  protobufjs: false
minimumReleaseAgeExclude:
  - '@modelcontextprotocol/sdk@1.31.0'
# docx lists @types/node as a runtime dependency (^26); keep the repo's own Node types.
overrides:
  docx>@types/node: 22.20.4
