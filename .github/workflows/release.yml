# Releases majhi on every push to main (docs/DECISIONS.md, "Automated releases"):
#   1. version: the next version from the conventional commits since the last release
#      (scripts/next-version.sh). No feat, fix, perf or breaking change: nothing else runs.
#   2. build: the server, runner and Laya images for linux/amd64 and linux/arm64, each CPU on its own
#      runner, natively, pushed by digest only: no version tag yet.
#   3. release, only when every build passed: tags the images ghcr.io/<owner>/majhi-*:<version>,
#      publishes runtime assets to majhi-releases, whose workflow creates the public release,
#      then records the source tag here.
#      install.sh and the host helper read that latest release, so a failed run publishes nothing.
#
# Images without the owner's user: compose adds it on each computer (Dockerfile, docker/owner.sh).
name: Release

on:
  push:
    branches: [main]

# One release at a time, in push order. GitHub keeps one waiting run: a newer push replaces it, and
# its release then covers both pushes' commits, so none is skipped.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

env:
  REGISTRY: ghcr.io/${{ github.repository_owner }}

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.next.outputs.version }}
    steps:
      # Every commit and tag, to find the last release and the commits since.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Next version
        id: next
        run: |
          version=$(sh scripts/next-version.sh)
          echo "version=$version" >>"$GITHUB_OUTPUT"
          if [ -n "$version" ]; then
            echo "Releasing $version"
          else
            echo "No feat, fix, perf or breaking change since the last release: nothing to release."
          fi

  build:
    name: build ${{ matrix.image }} (${{ matrix.arch }})
    needs: version
    if: needs.version.outputs.version != ''
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        image: [server, runner, laya, laya-cuda]
        arch: [amd64, arm64]
        include:
          - arch: amd64
            os: ubuntu-24.04
          - arch: arm64
            os: ubuntu-24.04-arm
          - image: server
            name: majhi-server
            file: Dockerfile
            target: runtime-build
          - image: runner
            name: majhi-runner
            file: Dockerfile
            target: runner-build
          - image: laya
            name: majhi-laya
            file: docker/laya.Dockerfile
            target: laya-build
          # PyTorch for CUDA 13.0, as `make up` picks for an NVIDIA GPU.
          - image: laya-cuda
            name: majhi-laya
            file: docker/laya.Dockerfile
            target: laya-build
            args: |
              TORCH_INDEX=https://download.pytorch.org/whl/cu130
              LAYA_DEVICE=cuda
    steps:
      - uses: actions/checkout@v7

      # The runner and CUDA images need more room than a fresh runner has free.
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          platforms: linux/${{ matrix.arch }}
          # The commit the server reports as running, as `make up` bakes it in.
          build-args: |
            MAJHI_COMMIT=${{ github.sha }}
            ${{ matrix.args }}
          # majhi.release: up.sh and the host helper remove other versions' images after an update.
          labels: |
            majhi.release=${{ needs.version.outputs.version }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.version.outputs.version }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ matrix.name }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.image }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}-${{ matrix.arch }}

      - name: Keep the digest
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}

      - uses: actions/upload-artifact@v7
        with:
          name: digest-${{ matrix.image }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  release:
    needs: [version, build]
    if: needs.version.outputs.version != ''
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # A rerun of an older run must not put its images under a version a newer commit released.
      - name: Check the version is still this commit's
        run: |
          if git rev-parse --quiet --verify "refs/tags/$VERSION" >/dev/null &&
            [ "$(git rev-parse "$VERSION^{commit}")" != "$GITHUB_SHA" ]; then
            echo "::error::$VERSION was released from another commit. Nothing to do for this one."
            exit 1
          fi

      # One folder per build: digest-<image>-<arch>/<digest>.
      - uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digest-*

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Joins each image's amd64 and arm64 builds under its version tags. docker-compose.yml asks for
      # Laya's `<version>` on the CPU (or `<version>-cpu`) and `<version>-cuda` with an NVIDIA GPU.
      - name: Tag the images
        working-directory: ${{ runner.temp }}/digests
        run: |
          set -eu
          publish() {
            image=$1 name=$2
            shift 2
            tags=""
            for tag in "$@"; do tags="$tags -t $REGISTRY/$name:$tag"; done
            refs=""
            for digest in "digest-$image-amd64"/* "digest-$image-arm64"/*; do
              refs="$refs $REGISTRY/$name@sha256:$(basename "$digest")"
            done
            # Tags and refs hold no spaces: split on purpose.
            # shellcheck disable=SC2086
            docker buildx imagetools create $tags $refs
            for tag in "$@"; do docker buildx imagetools inspect "$REGISTRY/$name:$tag" >/dev/null; done
          }
          publish server majhi-server "$VERSION"
          publish runner majhi-runner "$VERSION"
          publish laya majhi-laya "$VERSION" "$VERSION-cpu"
          publish laya-cuda majhi-laya "$VERSION-cuda"

      - name: Package runtime files
        run: sh scripts/package-release.sh "$VERSION" "$GITHUB_SHA" "$RUNNER_TEMP/runtime"

      - name: Publish to the public distribution repository
        env:
          RELEASES_DEPLOY_KEY: ${{ secrets.MAJHI_RELEASES_DEPLOY_KEY }}
          MAJHI_DISTRIBUTION_REPO: ${{ github.repository_owner }}/majhi-releases
        run: |
          set -eu
          [ -n "$RELEASES_DEPLOY_KEY" ] || { echo "::error::MAJHI_RELEASES_DEPLOY_KEY is not configured"; exit 1; }
          key="$RUNNER_TEMP/releases-key"
          hosts="$RUNNER_TEMP/releases-known-hosts"
          trap 'rm -f "$key" "$hosts"' EXIT
          (umask 077; printf '%s\n' "$RELEASES_DEPLOY_KEY" >"$key")
          # GitHub host keys come from its authenticated HTTPS API.
          gh api meta --jq '.ssh_keys[] | "github.com " + .' >"$hosts"
          [ -s "$hosts" ]
          export GIT_SSH_COMMAND="ssh -i $key -o IdentitiesOnly=yes -o UserKnownHostsFile=$hosts -o StrictHostKeyChecking=yes"
          sh scripts/publish-release.sh "$VERSION" "$GITHUB_SHA" "$RUNNER_TEMP/runtime"

      - name: Wait for public release assets
        env:
          DISTRIBUTION_REPO: ${{ github.repository_owner }}/majhi-releases
        run: |
          set -eu
          # The public repository publishes with its own GITHUB_TOKEN after the deploy-key push.
          for attempt in $(seq 1 60); do
            if gh release view "$VERSION" --repo "$DISTRIBUTION_REPO" \
              --json assets --jq '.assets[].name' >"$RUNNER_TEMP/public-assets" 2>/dev/null &&
              grep -qx 'majhi-runtime.tar.gz' "$RUNNER_TEMP/public-assets" &&
              grep -qx 'majhi-runtime.tar.gz.sha256' "$RUNNER_TEMP/public-assets" &&
              grep -qx 'release.json' "$RUNNER_TEMP/public-assets"; then
              break
            fi
            [ "$attempt" -lt 60 ] || { echo "::error::Public release assets were not published in time"; exit 1; }
            sleep 10
          done

      - name: Record source release tag
        run: |
          set -eu
          # Source versioning keeps its tags here. Public tags contain only distribution files.
          if ! git rev-parse --quiet --verify "refs/tags/$VERSION" >/dev/null; then
            gh api "repos/$GITHUB_REPOSITORY/git/refs" -f "ref=refs/tags/$VERSION" -f "sha=$GITHUB_SHA" >/dev/null
          fi
