# Release images: a version tag (vX.Y.Z) builds the server, runner and Laya images for linux/amd64
# and linux/arm64 and pushes them to ghcr.io/<owner>/majhi-*:<tag>, where install.sh's checkouts take
# them from (docker-compose.yml, docs/DECISIONS.md "Release images"). Each CPU builds on its own
# runner, natively; a last job joins the two into one multi-arch tag.
#
# Images without the owner's user: compose adds it on each computer (Dockerfile, docker/owner.sh).
name: Release images

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io/${{ github.repository_owner }}

jobs:
  build:
    name: ${{ matrix.image }} (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: true
      matrix:
        image: [server, runner, laya, laya-cuda]
        arch: [amd64, arm64]
        include:
          - arch: amd64
            os: ubuntu-24.04
          - arch: arm64
            os: ubuntu-24.04-arm
          - image: server
            name: majhi-server
            file: Dockerfile
            target: runtime-build
          - image: runner
            name: majhi-runner
            file: Dockerfile
            target: runner-build
          - image: laya
            name: majhi-laya
            file: docker/laya.Dockerfile
            target: laya-build
          # PyTorch for CUDA 13.0, as `make up` picks for an NVIDIA GPU.
          - image: laya-cuda
            name: majhi-laya
            file: docker/laya.Dockerfile
            target: laya-build
            args: |
              TORCH_INDEX=https://download.pytorch.org/whl/cu130
              LAYA_DEVICE=cuda
    steps:
      - uses: actions/checkout@v5

      # The runner and CUDA images need more room than a fresh runner has free.
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          platforms: linux/${{ matrix.arch }}
          # The commit the server reports as running, as `make up` bakes it in.
          build-args: |
            MAJHI_COMMIT=${{ github.sha }}
            ${{ matrix.args }}
          # majhi.release: up.sh and the host helper remove other versions' images after an update.
          labels: |
            majhi.release=${{ github.ref_name }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ matrix.name }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.image }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}-${{ matrix.arch }}

      - name: Keep the digest
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}

      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.image }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: ${{ matrix.image }}
    needs: build
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        include:
          - image: server
            name: majhi-server
            tags: ${{ github.ref_name }}
          - image: runner
            name: majhi-runner
            tags: ${{ github.ref_name }}
          # docker-compose.yml asks for `<tag>` on the CPU, `<tag>-cpu` when the owner names the CPU,
          # and `<tag>-cuda` with an NVIDIA GPU.
          - image: laya
            name: majhi-laya
            tags: ${{ github.ref_name }} ${{ github.ref_name }}-cpu
          - image: laya-cuda
            name: majhi-laya
            tags: ${{ github.ref_name }}-cuda
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digest-${{ matrix.image }}-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Join amd64 and arm64 under the version tag
        working-directory: ${{ runner.temp }}/digests
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ matrix.name }}
          TAGS: ${{ matrix.tags }}
        run: |
          set -eu
          tag_args=""
          for tag in $TAGS; do tag_args="$tag_args -t $IMAGE:$tag"; done
          # shellcheck disable=SC2046,SC2086
          docker buildx imagetools create $tag_args $(printf "$IMAGE@sha256:%s " *)
          for tag in $TAGS; do docker buildx imagetools inspect "$IMAGE:$tag"; done
